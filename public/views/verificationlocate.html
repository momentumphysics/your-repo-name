<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Location Verification</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="card">
    <h2>Verify Your Region</h2>
    <form action="/api/locate" method="POST">
      <label for="region">Select or enter your region:</label>
      <input type="text" id="region" name="region" placeholder="e.g., California, US" required />
      <button type="submit">Continue</button>
    </form>
  </div>
</body>
</html>
