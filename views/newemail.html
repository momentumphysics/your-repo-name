<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Update Email Address</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="card">
    <h2>Enter New Email</h2>
    <form action="/api/newemail" method="POST">
      <label for="newEmail">New Email Address:</label>
      <input type="email" id="newEmail" name="newEmail" placeholder="name@example.com" required />
      <button type="submit">Submit</button>
    </form>
  </div>
</body>
</html>
