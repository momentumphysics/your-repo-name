<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roblox Account Recovery</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body class="bg-[#111216] text-white min-h-screen flex flex-col justify-between font-sans antialiased select-none">

    <!-- HEADER / NAVIGATION -->
    <header class="w-full bg-[#111216] border-b border-[#23252a] px-4 pt-3 pb-2.5">
      <!-- Top Row: Logo, Sign Up, Search -->
      <div class="flex items-center justify-between mb-3">
        <!-- Roblox Logo -->
        <a href="#" class="text-white hover:opacity-90 transition-opacity">
          <svg class="w-7 h-7 fill-white" viewBox="0 0 24 24">
            <path fill-rule="evenodd" d="M4.654 0L0 17.378l17.378 4.654L22.032 4.654 4.654 0zm6.98 9.387l4.385 1.175-1.175 4.385-4.385-1.175 1.175-4.385z" />
          </svg>
        </a>

        <!-- Right Action: Sign Up & Search Icon -->
        <div class="flex items-center gap-3.5">
          <button class="bg-[#3977ff] hover:bg-[#2e68ea] text-white text-sm font-semibold px-4 py-1.5 rounded-full transition-colors">
            Sign Up
          </button>
          <button class="text-white hover:text-zinc-300 transition-colors p-1" aria-label="Search">
            <svg class="w-6 h-6 stroke-current stroke-[2.2]" fill="none" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Sub Navigation Menu -->
      <nav class="flex items-center justify-between text-[13px] font-semibold text-zinc-200 px-2">
        <a href="#" class="hover:text-white transition-colors">Charts</a>
        <a href="#" class="hover:text-white transition-colors">Marketplace</a>
        <a href="#" class="hover:text-white transition-colors">Create</a>
        <a href="#" class="hover:text-white transition-colors">Robux</a>
      </nav>
    </header>

    <!-- MAIN RECOVERY CARD -->
    <main class="flex-1 flex items-center justify-center px-4 py-6">
      <div class="w-full max-w-[420px] bg-[#222428] rounded-xl p-6 sm:p-7 shadow-2xl border border-[#2b2d33]/50">
        <h1 class="text-center text-white font-bold text-base sm:text-lg mb-6">
          Roblox Account Recovery
        </h1>

        <form id="recovery-form" class="space-y-4" onsubmit="event.preventDefault();">
          <div>
            <label for="account-input" class="block text-xs font-semibold text-zinc-300 mb-2">
              Username/Email/Phone
            </label>
            <input
              id="account-input"
              type="text"
              placeholder="Enter your username, email, or phone number"
              class="w-full bg-[#111216] text-white text-sm rounded-lg px-3.5 py-3 border border-[#393b42] focus:border-[#3977ff] focus:outline-none transition-colors placeholder:text-zinc-500"
              autocomplete="off"
            />
          </div>

          <!-- Dynamic Button (Aktif saat terisi) -->
          <button
            id="btn-next"
            type="submit"
            disabled
            class="w-full py-3 rounded-lg text-sm font-semibold transition-all duration-200 bg-[#25396d] text-[#6d7fae] cursor-not-allowed mt-2"
          >
            Next
          </button>
        </form>
      </div>
    </main>

    <!-- BOTTOM FLOATING BANNER -->
    <footer id="bottom-banner" class="w-full bg-[#17181c] border-t border-[#2a2c33] px-3.5 py-2.5 flex items-center justify-between z-50">
      <div class="flex items-center gap-3">
        <!-- Close Button (X) -->
        <button id="btn-close-banner" class="text-zinc-400 hover:text-white p-1" aria-label="Close">
          <svg class="w-5 h-5 stroke-current stroke-2" fill="none" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>

        <!-- App Icon -->
        <div class="w-10 h-10 rounded-xl bg-[#3977ff] flex items-center justify-center flex-shrink-0 shadow">
          <svg class="w-6 h-6 fill-white" viewBox="0 0 24 24">
            <path fill-rule="evenodd" d="M4.654 0L0 17.378l17.378 4.654L22.032 4.654 4.654 0zm6.98 9.387l4.385 1.175-1.175 4.385-4.385-1.175 1.175-4.385z" />
          </svg>
        </div>

        <!-- App Description -->
        <div class="flex flex-col">
          <span class="text-white text-xs font-semibold leading-snug">Explore Roblox in our Android app!</span>
          <span class="text-zinc-400 text-[11px] leading-snug">Millions of experiences by people like you</span>
        </div>
      </div>

      <!-- Visit Button -->
      <a
        href="#"
        class="bg-[#3977ff] hover:bg-[#2e68ea] text-white text-xs font-semibold px-4 py-1.5 rounded-full transition-colors ml-2"
      >
        Visit
      </a>
    </footer>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
